<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - IntelliBusiness</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-wrapper">
        <!-- Decorative Blobs -->
        <div class="auth-blob auth-blob-1"></div>
        <div class="auth-blob auth-blob-2"></div>

        <!-- Glassmorphism Card -->
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <a href="index.html" class="auth-brand">
                    <i class="fas fa-brain"></i> IntelliBusiness
                </a>
                <h1 class="auth-title">Reset Password</h1>
                <p class="auth-subtitle">Enter your email and we'll send you a link to reset your password</p>
            </div>

            <!-- Dynamic Alert Banners -->
            <div id="alertError" class="auth-alert auth-alert-danger" role="alert">
                <i class="fas fa-exclamation-circle me-1"></i>
                <span id="alertErrorMessage">An error occurred</span>
            </div>

            <div id="alertSuccess" class="auth-alert auth-alert-success" role="alert">
                <i class="fas fa-check-circle me-1"></i>
                <span id="alertSuccessMessage">Reset link sent! Please check your email.</span>
            </div>

            <!-- Reset Form -->
            <form id="forgotPasswordForm" novalidate>
                <!-- Email Field -->
                <div class="form-group-icon">
                    <input type="email" id="email" class="form-control" placeholder="Enter your email" required>
                    <i class="fas fa-envelope input-icon-left"></i>
                    <div class="invalid-feedback">Please enter a valid email address.</div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="btnSubmit" class="btn btn-auth">
                    <span id="btnText">Send Reset Link</span>
                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                </button>
            </form>

            <!-- Footer Links -->
            <div class="auth-footer">
                Remembered your password? <a href="login.html">Back to Login</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Forgot Password JavaScript -->
    <script src="js/forgot-password.js"></script>
</body>
</html>
