<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Summary - IntelliBusiness</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/summary.css">
</head>
<body class="summary-page-body">
    <div class="summary-shell container py-5">
        <div class="summary-header card border-0 shadow-sm mb-4">
            <div class="card-body p-4 p-md-5">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
                    <div>
                        <div class="summary-eyebrow"><img class="brand-logo-image" src="assets/images/intellibusiness-logo.svg" alt="IntelliBusiness"> AI Document Summary</div>
                        <h1 class="summary-title mb-0">Document Summary</h1>
                    </div>
                    <div class="summary-actions d-flex gap-2 flex-wrap">
                        <button class="btn btn-outline-primary rounded-pill" id="copySummaryBtn"><i class="fas fa-copy me-2"></i>Copy Summary</button>
                        <button class="btn btn-primary rounded-pill" id="downloadSummaryBtn"><i class="fas fa-download me-2"></i>Download Summary</button>
                        <button class="btn btn-outline-secondary rounded-pill" id="regenerateSummaryBtn"><i class="fas fa-sync me-2"></i>Regenerate</button>
                        <a href="documents.html" class="btn btn-outline-dark rounded-pill"><i class="fas fa-arrow-left me-2"></i>Close</a>
                    </div>
                </div>
            </div>
        </div>

        <div id="summaryLoadingState" class="loading-state card border-0 shadow-sm mb-4 d-none">
            <div class="card-body p-4 text-center">
                <div class="loading-spinner mb-3"><span></span></div>
                <h4 class="mb-2">AI Document Analysis</h4>
                <p class="mb-1">Reading your document...</p>
                <p class="text-muted mb-0">Analyzing key information...</p>
            </div>
        </div>

        <div id="summaryErrorState" class="alert alert-danger d-none" role="alert"></div>

        <div id="summaryContent" class="summary-content d-none">
            <div class="summary-meta card border-0 shadow-sm mb-4">
                <div class="card-body p-4">
                    <div class="summary-meta-grid">
                        <div>
                            <span class="meta-label">Document</span>
                            <div id="summaryDocumentName" class="meta-value">-</div>
                        </div>
                        <div>
                            <span class="meta-label">Generated</span>
                            <div id="summaryGeneratedAt" class="meta-value">-</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="summary-section card border-0 shadow-sm mb-4">
                <div class="card-body p-4">
                    <h3 class="section-title"><i class="fas fa-lightbulb me-2"></i>Executive Summary</h3>
                    <p id="executiveSummaryText" class="section-body"></p>
                </div>
            </div>

            <div class="summary-section card border-0 shadow-sm mb-4">
                <div class="card-body p-4">
                    <h3 class="section-title"><i class="fas fa-list-check me-2"></i>Key Points</h3>
                    <ul id="keyPointsList" class="summary-list"></ul>
                </div>
            </div>

            <div class="summary-section card border-0 shadow-sm mb-4">
                <div class="card-body p-4">
                    <h3 class="section-title"><i class="fas fa-circle-info me-2"></i>Important Information</h3>
                    <ul id="importantInfoList" class="summary-list"></ul>
                </div>
            </div>

            <div class="summary-section card border-0 shadow-sm mb-4">
                <div class="card-body p-4">
                    <h3 class="section-title"><i class="fas fa-clipboard-check me-2"></i>Action Items</h3>
                    <ul id="actionItemsList" class="summary-list"></ul>
                </div>
            </div>

            <div class="summary-section card border-0 shadow-sm mb-4">
                <div class="card-body p-4">
                    <h3 class="section-title"><i class="fas fa-tags me-2"></i>Keywords</h3>
                    <div id="keywordsList" class="keyword-badges"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/summary.js"></script>
</body>
</html>
