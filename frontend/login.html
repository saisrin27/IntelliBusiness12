<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - IntelliBusiness</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-wrapper">
        <!-- Decorative Blobs -->
        <div class="auth-blob auth-blob-1"></div>
        <div class="auth-blob auth-blob-2"></div>

        <!-- Glassmorphism Card -->
        <div class="auth-card">
            <!-- Header -->
            <div class="auth-header">
                <a href="index.html" class="auth-brand">
                    <img class="brand-logo-image" src="assets/images/intellibusiness-logo.svg" alt="IntelliBusiness"> IntelliBusiness
                </a>
                <h1 class="auth-title">Welcome Back</h1>
                <p class="auth-subtitle">Log in to manage your AI workspace & analytics</p>
            </div>

            <!-- Dynamic Alert Banners -->
            <div id="alertError" class="auth-alert auth-alert-danger" role="alert">
                <i class="fas fa-exclamation-circle me-1"></i>
                <span id="alertErrorMessage">Invalid credentials</span>
            </div>

            <div id="alertSuccess" class="auth-alert auth-alert-success" role="alert">
                <i class="fas fa-check-circle me-1"></i>
                <span id="alertSuccessMessage">Login successful! Redirecting...</span>
            </div>

            <!-- Login Form -->
            <form id="loginForm" novalidate>
                <!-- Email Field -->
                <div class="form-group-icon">
                    <input type="email" id="email" class="form-control" placeholder="Email address" required>
                    <i class="fas fa-envelope input-icon-left"></i>
                    <div class="invalid-feedback">Please enter a valid email address.</div>
                </div>

                <!-- Password Field -->
                <div class="form-group-icon">
                    <input type="password" id="password" class="form-control" placeholder="Password" required>
                    <i class="fas fa-lock input-icon-left"></i>
                    <button type="button" class="toggle-password" id="togglePassword" title="Toggle password visibility">
                        <i class="fas fa-eye" id="togglePasswordIcon"></i>
                    </button>
                    <div class="invalid-feedback">Please enter your password.</div>
                </div>

                <!-- Options Row -->
                <div class="d-flex justify-content-between align-items-center mb-3 text-sm">
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="rememberMe">
                        <label class="form-check-label text-muted" for="rememberMe" style="font-size: 0.875rem;">Remember me</label>
                    </div>
                    <a href="forgot-password.html" class="text-primary text-decoration-none" style="font-size: 0.875rem; font-weight: 500;">Forgot Password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="btnSubmit" class="btn btn-auth">
                    <span id="btnText">Log In</span>
                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                </button>
            </form>

            <!-- Footer Links -->
            <div class="auth-footer">
                Don't have an account? <a href="register.html">Create Account</a>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Login JavaScript -->
    <script src="js/login.js?v=20260825-admin"></script>
</body>
</html>
